name: Upload to TestFlight

on:
  workflow_dispatch:
    inputs:
      team_id:
        description: Apple Developer Team ID (lamna tomt for automatisk hamtning via API-nyckeln)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID_INPUT: ${{ inputs.team_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "Saknade GitHub Secrets:$missing" >&2
            exit 1
          fi
          echo "Alla tre secrets finns."

      - name: Select Xcode
        run: |
          APP=$(python3 scripts/select_xcode.py)
          sudo xcode-select -s "$APP/Contents/Developer"
          echo "DEVELOPER_DIR=$APP/Contents/Developer" >> "$GITHUB_ENV"
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install API key
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          python3 "$GITHUB_WORKSPACE/scripts/write_asc_key.py" "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install API dependencies
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pyjwt cryptography

      # Id:na pa de certifikat som redan finns. Stadsteget efter exporten
      # aterkallar bara det som tillkommit under den har korningen.
      - name: Save certificate ids
        run: |
          mkdir -p build
          python3 "$GITHUB_WORKSPACE/scripts/asc_revoke_ci_certificates.py"             --spara-id build/cert-baseline.txt

      - name: Resolve team ID
        run: |
          if [ -n "$TEAM_ID_INPUT" ]; then
            echo "Anvander angivet team: $TEAM_ID_INPUT"
            echo "DEVELOPMENT_TEAM=$TEAM_ID_INPUT" >> "$GITHUB_ENV"
            exit 0
          fi
          python3 "$GITHUB_WORKSPACE/scripts/asc_team_id.py" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project AiMRemote.xcodeproj \
            -scheme AiMRemote \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/AiMRemote.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export signed IPA
        run: |
          set -o pipefail
          python3 "$GITHUB_WORKSPACE/scripts/export_options.py" build/ExportOptions.plist
          cat build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/AiMRemote.xcarchive" \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath "$PWD/build/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/export

      # Automatisk signering skapade ett nytt Apple Development-certifikat
      # under korningen. Det aterkallas har, sa att hogen inte vaxer och
      # arkiveringen inte faller nasta gang av "Choose a certificate to
      # revoke". Bara certifikat med namnet "Apple Development: Created via
      # API" som saknas i listan ovan rors; distributionscertifikatet
      # lamnas. Steget far aldrig falla korningen.
      - name: Revoke certificates created by this run
        if: always()
        continue-on-error: true
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/asc_revoke_ci_certificates.py"             --utom-fil build/cert-baseline.txt || true

      - name: Verify bundle before upload
        run: |
          APP="build/AiMRemote.xcarchive/Products/Applications/AiMRemote.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$APP/Info.plist"
          codesign -dv --verbose=2 "$APP" 2>&1 | sed -n "1,12p"
          # Widgeten ska ligga med och vara signerad med egen profil.
          for EXT in "$APP"/PlugIns/*.appex; do
            [ -d "$EXT" ] || continue
            echo "Tillagg: $EXT"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$EXT/Info.plist"
            codesign -dv --verbose=2 "$EXT" 2>&1 | sed -n "1,8p"
          done

      - name: Upload to TestFlight
        run: |
          IPA=$(ls build/export/*.ipa | head -1)
          echo "Laddar upp $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep IPA as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AiM-Remote-TestFlight-${{ github.run_number }}
          path: build/export
          if-no-files-found: ignore

      - name: Remove API key
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8
