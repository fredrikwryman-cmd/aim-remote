name: Build Tech Rabbit Remote for iPhone
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          APP=$(python3 scripts/select_xcode.py)
          sudo xcode-select -s "$APP/Contents/Developer"
          echo "DEVELOPER_DIR=$APP/Contents/Developer" >> "$GITHUB_ENV"
          sw_vers
          xcodebuild -version
          swift --version
      - name: Protocol tests
        run: swift test --package-path Packages/AiMCore
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select iPhone simulator
        run: python3 scripts/select_simulator.py >> "$GITHUB_ENV"
      - name: App and UI tests
        run: |
          echo "Simulator: $SIMULATOR_NAME"
          xcodebuild test -project AiMRemote.xcodeproj -scheme AiMRemote \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath build/AiMRemote-tests.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Build unsigned iPhone app
        run: |
          xcodebuild build -project AiMRemote.xcodeproj -scheme AiMRemote \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Package/Payload
          ditto build/DerivedData/Build/Products/Release-iphoneos/AiMRemote.app build/Package/Payload/AiMRemote.app
          cd build/Package
          zip -qr ../AiM-Remote-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AiM-Remote-unsigned-IPA
          path: build/AiM-Remote-unsigned.ipa
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AiM-Remote-test-results
          path: build/AiMRemote-tests.xcresult
          if-no-files-found: ignore
