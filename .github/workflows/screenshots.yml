name: Design screenshots

# Tar simulatorbilder av R01 Start, R02 Fjarr mork och R02 Fjarr ljus pa en
# 390 x 844-iPhone och pa 375 x 667, och laddar upp dem som artifact.
# Saknas enhetstypen for en storlek hoppas den over utan att falla.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 45
    # 375 x 667 ar en extra kontroll och far aldrig falla hela korningen.
    continue-on-error: ${{ matrix.size == '375x667' }}
    strategy:
      fail-fast: false
      matrix:
        size: ["390x844", "375x667"]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          APP=$(python3 scripts/select_xcode.py)
          sudo xcode-select -s "$APP/Contents/Developer"
          echo "DEVELOPER_DIR=$APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Select simulator
        run: |
          set +e
          UDID=$(python3 scripts/select_shot_simulator.py "${{ matrix.size }}")
          STATUS=$?
          set -e
          if [ "$STATUS" = "3" ]; then
            echo "::notice::Ingen simulator med ${{ matrix.size }} finns pa runnern. Storleken hoppas over."
            echo "SKIP_SIZE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$STATUS" != "0" ] || [ -z "$UDID" ]; then
            echo "Kunde inte valja simulator (status $STATUS)." >&2
            exit 1
          fi
          echo "Simulator: $UDID"
          echo "SIMULATOR_ID=$UDID" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        if: env.SKIP_SIZE != '1'
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Boot simulator
        if: env.SKIP_SIZE != '1'
        run: |
          # Kall simulator ar varfor forsta testet foll. Boota och vanta ut den.
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl list devices | grep "$SIMULATOR_ID" || true

      - name: Build for testing
        if: env.SKIP_SIZE != '1'
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AiMRemote.xcodeproj \
            -scheme AiMRemote \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath "$PWD/build/dd" \
            CODE_SIGNING_ALLOWED=NO

      - name: Warm up the app once
        if: env.SKIP_SIZE != '1'
        continue-on-error: true
        run: |
          # Forsta starten tar langst tid. Gor den utanfor testet.
          APP=$(find "$PWD/build/dd/Build/Products" -maxdepth 2 -name "AiMRemote.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::notice::Hittade ingen byggd app att vara upp med."
            exit 0
          fi
          echo "Varmer upp $APP"
          xcrun simctl install "$SIMULATOR_ID" "$APP"
          xcrun simctl launch "$SIMULATOR_ID" se.aim.remote || true
          sleep 8
          xcrun simctl terminate "$SIMULATOR_ID" se.aim.remote || true

      - name: Run design screenshot tests
        if: env.SKIP_SIZE != '1'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AiMRemote.xcodeproj \
            -scheme AiMRemote \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath "$PWD/build/dd" \
            -resultBundlePath "$PWD/build/shots-${{ matrix.size }}.xcresult" \
            -only-testing:AiMRemoteUITests/DesignShotTests \
            -retry-tests-on-failure \
            -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO

      - name: Export screenshots
        if: always() && env.SKIP_SIZE != '1'
        run: |
          OUT="build/screenshots/${{ matrix.size }}"
          python3 scripts/export_screenshots.py \
            "build/shots-${{ matrix.size }}.xcresult" \
            "$OUT" "${{ matrix.size }}"
          COUNT=$(ls -1 "$OUT"/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "Bilder: $COUNT"
          ls -la "$OUT" || true
          if [ "$COUNT" = "0" ]; then
            echo "::notice::Inga bilder kunde plockas ut ur resultatet for ${{ matrix.size }}."
          else
            echo "HAS_SHOTS=1" >> "$GITHUB_ENV"
          fi

      - name: Upload screenshots
        if: always() && env.HAS_SHOTS == '1'
        uses: actions/upload-artifact@v4
        with:
          name: TechRabbitRemote-screenshots-${{ matrix.size }}
          path: build/screenshots/${{ matrix.size }}
          if-no-files-found: ignore

      - name: Keep the result bundle when no images came out
        if: always() && env.SKIP_SIZE != '1' && env.HAS_SHOTS != '1'
        uses: actions/upload-artifact@v4
        with:
          name: TechRabbitRemote-shots-xcresult-${{ matrix.size }}
          path: build/shots-${{ matrix.size }}.xcresult
          if-no-files-found: ignore

      - name: Report result
        if: always() && env.SKIP_SIZE != '1'
        run: |
          if [ "$HAS_SHOTS" = "1" ]; then
            echo "Bilder for ${{ matrix.size }} finns som artifact."
          else
            echo "::warning::Inga bilder for ${{ matrix.size }}. Resultatpaketet ar sparat som artifact."
            exit 1
          fi
