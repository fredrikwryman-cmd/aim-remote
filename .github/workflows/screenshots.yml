name: Export existing UI screenshots
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful iPhone build run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AiM-Remote-test-results
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/AiMRemote-tests.xcresult
      - run: python3 scripts/export_screenshots.py build/AiMRemote-tests.xcresult build/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: AiM-Remote-screenshots
          path: build/screenshots
          if-no-files-found: error
