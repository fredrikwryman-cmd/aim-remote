name: AiMRemote
options:
  projectFormat: xcode15_3
  xcodeVersion: '15.4'
  bundleIdPrefix: se.aim
  deploymentTarget:
    iOS: '16.4'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.4'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  AiMCore:
    path: Packages/AiMCore
targets:
  AiMRemote:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.aim.remote
        MARKETING_VERSION: '1.0.0'
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_NAME: AiMRemote
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/AiMRemote.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': App/Simulator.entitlements
    dependencies:
      - package: AiMCore
      - target: TechRabbitWidget
        embed: true
  TechRabbitWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - Widget.entitlements
          - Simulator.entitlements
      # Delas med appen: samma klientidentitet, samma lista och samma pinning.
      - path: App/Connection/IdentityStore.swift
      - path: App/Connection/SavedTV.swift
      - path: App/Connection/SharedStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.aim.remote.widget
        MARKETING_VERSION: '1.0.0'
        PRODUCT_NAME: TechRabbitWidget
        INFOPLIST_FILE: Widget/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        TARGETED_DEVICE_FAMILY: '1'
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': Widget/Simulator.entitlements
    dependencies:
      - package: AiMCore
  AiMRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: se.aim.remote.tests
    dependencies:
      - target: AiMRemote
  AiMRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: se.aim.remote.uitests
    dependencies:
      - target: AiMRemote
schemes:
  AiMRemote:
    build:
      targets:
        AiMRemote: all
        TechRabbitWidget: all
    test:
      targets:
        - AiMRemoteTests
        - AiMRemoteUITests
      gatherCoverageData: true
